<!DOCTYPE html>
<html lang="ja">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0W12QHHBRH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-0W12QHHBRH');
    </script>


    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#0b1433">
    <title>屋台ボッコ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
    <canvas id="bg"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <div id="ui">
        <div id="topbtns">
            <button id="btnLite" title="軽量モード">軽</button>
            <button id="btnMute" title="ミュート"></button>
        </div>
        <div id="toasts"></div>

        <div id="title" class="screen">
            <div class="ttl"><span class="deco" data-t="屋台"><span class="fg">屋台</span></span><br><span class="deco"
                                                                                                           data-t="ボッコ"><span
                    class="fg">ボッコ</span></span></div>
            <div class="catch deco" data-t="今夜も爺さん、星になる。"><span class="fg">今夜も爺さん、星になる。</span></div>
            <button id="btnFest">お祭りモード：OFF</button>
            <button id="btnStart">はじめる</button>
            <div class="minis">
                <button data-m="weapon">どうぐ</button>
                <button data-m="zukan">図鑑</button>
                <button data-m="serif">セリフ帳</button>
                <button data-m="ach">実績</button>
            </div>
        </div>

        <div id="result" class="screen panel">
            <div class="card">
                <div class="rl">本日の売上</div>
                <div class="rs"><span id="rSales">0</span><small>円</small></div>
                <div class="rr" id="rRank"></div>
                <div class="rgrid" id="rStats"></div>
                <div class="rbest" id="rBest"></div>
                <div class="rnote" id="rNote"></div>
                <button class="big" id="btnRetry">もう一回</button>
                <button class="mid" id="btnPost">Xでポスト</button>
                <button class="link" id="btnTop">タイトルへ</button>
            </div>
        </div>

        <div id="menu" class="screen panel">
            <div class="card">
                <div class="mhead"><span id="mTitle"></span>
                    <button id="mClose">とじる</button>
                </div>
                <div id="mBody"></div>
            </div>
        </div>
        <div id="err">この端末では3D表示（WebGL）が使えないため、遊べません。<br>別のブラウザでお試しください。</div>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
