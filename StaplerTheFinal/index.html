<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0W12QHHBRH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-0W12QHHBRH');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>ホッチキス・ザ・ファイナル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Yusei+Magic&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
    <div id="topbar">
        <button id="btnLight" class="mini">軽量モード：OFF</button>
        <button id="btnMute" class="mini">音：ON</button>
    </div>

    <section id="title" class="screen">
        <div id="logo">
            <div class="r1"></div>
            <div class="r2"></div>
        </div>
        <div id="catch"></div>
        <div id="startMsg" class="blink"></div>
        <div id="titleStats"></div>
        <div class="btnRow">
            <button id="btnZukan" class="btn yellow">称号図鑑</button>
        </div>
    </section>

    <div id="hint"></div>

    <div id="power">
        <div class="ptitle"></div>
        <div class="bar">
            <div class="z weak"></div>
            <div class="z just"></div>
            <div class="z strong"></div>
            <div class="marker"></div>
        </div>
        <div class="lab weak"></div>
        <div class="lab just"></div>
        <div class="lab strong"></div>
    </div>

    <div id="bubble">
        <div class="in"></div>
    </div>
    <div id="telop">
        <div class="in"></div>
    </div>
    <div id="shout">
        <div class="in"></div>
    </div>
    <div id="stampWrap">
        <canvas id="stampCanvas" width="512" height="512"></canvas>
    </div>
    <div id="gameover">
        <div class="go1"></div>
        <div class="go2"></div>
        <div class="go3"></div>
    </div>
    <div id="flash"></div>

    <section id="result" class="screen panel"></section>
    <section id="zukan" class="screen panel"></section>
    <div id="loading">準備中…</div>
    <div id="err">WebGLが使えないみたいです…（ブラウザを変えてみてください）</div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
