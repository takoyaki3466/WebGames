<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>×を押させろ</title>
<style>
/* 「×を押させろ 3D」— a fictional retro OS ("閉窓OS") where the UI itself is the enemy.

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", system-ui, sans-serif; color: #000; user-select: none; -webkit-user-select: none; background: #3f5a8c; }
.hidden { display: none !important; }
button { font-family: inherit; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#gl.pointer { cursor: pointer; }

#taskbar { position: fixed; top: 0; left: 0; right: 0; height: 34px; background: #c6c3bd; border-bottom: 2px solid #fff; box-shadow: 0 1px 0 #404040; display: flex; align-items: center; gap: 6px; padding: 0 4px; z-index: 50; }
.start { font-weight: 700; padding: 2px 10px; background: #c6c3bd; border: 2px solid; border-color: #fff #404040 #404040 #fff; }
.task { flex: 1; min-width: 0; background: #d8d5cf; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tray { display: flex; gap: 8px; align-items: center; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 1px 8px; white-space: nowrap; }
#hearts { color: #d00; letter-spacing: 2px; }
#mute { background: none; border: 0; cursor: pointer; padding: 0; font-size: 14px; }
#save-note { font-size: 11px; color: #333; }
#save-note.warn { color: #a00; font-weight: 700; }

.say { position: fixed; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .15s; max-width: 280px; }
.say.show { opacity: 1; }
#say-ad { transform: translate(-50%, -100%); background: #ffffe1; border: 1px solid #000; padding: 5px 9px; font-weight: 700; box-shadow: 2px 2px 0 rgba(0,0,0,.4); }
#say-ad.designer { background: #fff; border: 2px dashed #a0f; }
#say-ad::after { content: ""; position: absolute; left: 50%; bottom: -13px; border: 6px solid transparent; border-top-color: #000; }
#say-x { transform: translate(-50%, -100%); background: #ffffe1; border: 1px solid #000; font-size: 11px; padding: 2px 6px; }
.tray-balloon { top: 42px; right: 10px; background: #ffffe1; border: 1px solid #000; border-radius: 8px; padding: 8px 12px; box-shadow: 2px 2px 0 rgba(0,0,0,.3); }
.tray-balloon::before { content: "ℹ 閉窓OS"; display: block; font-weight: 700; font-size: 11px; color: #000080; }
#score-pop { position: fixed; right: 24px; top: 96px; font: 900 24px sans-serif; color: #000080; opacity: 0; pointer-events: none; z-index: 55; text-shadow: 1px 1px 0 #fff; }
#score-pop.show { animation: popup 1s ease-out; }
@keyframes popup { 0% { opacity: 1; transform: translateY(10px); } 100% { opacity: 0; transform: translateY(-20px); } }
#applause { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 64px; opacity: 0; pointer-events: none; z-index: 70; }
#applause.show { animation: popup 1.4s ease-out; }
#blackout { position: fixed; inset: 0; background: #000; z-index: 90; display: flex; align-items: center; justify-content: center; color: #555; font-size: 18px; animation: fadein 1.5s; }
@keyframes fadein { from { opacity: 0; } }
body.batsu .start { font-size: 0; }
body.batsu .start::after { content: "×"; font-size: 14px; }
@media (max-width: 600px) { #save-note { display: none; } .say { max-width: 200px; font-size: 12px; } }

</style>
</head>

<div id="say-ad" class="say"></div>
<div id="say-x" class="say"></div>
<div id="say-os" class="say tray-balloon"></div>
<div id="score-pop"></div>

    }

      }

        save.fewestMisclicks = run.misclicks;
        rec.push("誤クリック最少");
      }
      if (run.score > save.bestStoryScore) {
        save.bestStoryScore = run.score;
        rec.push("本編ハイスコア");
      }
      if (run.earnsHiddenStage && !save.hiddenUnlocked) {
        save.hiddenUnlocked = true;
        rec.push("隠しステージ解放");
      }
    }
    if (run.mode === "hidden" && run.won && !save.hiddenCleared) {
      save.hiddenCleared = true;
      rec.push("広告の向こう側に到達");
    }
    if (run.mode === "endless" && run.cleared > save.endlessBest) {
      save.endlessBest = run.cleared;
      rec.push("エンドレス最多");
    }

      for (const t of from) if (!into.includes(t)) into.push(t);
    };

  }
